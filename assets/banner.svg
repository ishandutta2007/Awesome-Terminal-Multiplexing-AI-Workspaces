<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .code-term {
      font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #38bdf8;
    }

    /* Ambient Dynamic Pulsing Animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.45; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .ambient-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 250px;
    }
    .glow-border {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .animated-grid {
      stroke-dasharray: 8 8;
      animation: flowLine 25s linear infinite;
    }
    .cursor-blink {
      animation: blinkCursor 1s step-end infinite;
    }
    .pill-float-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPill 6s ease-in-out infinite 1s;
    }
    .pill-float-3 {
      animation: floatPill 5.5s ease-in-out infinite 2s;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Dynamic Ambient Decorative Mesh / Orbs (strictly in background) -->
  <circle class="ambient-orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="ambient-orb-2" cx="1020" cy="240" r="160" fill="#818cf8" filter="url(#glow)" />
  <circle cx="600" cy="380" r="180" fill="#c084fc" opacity="0.15" filter="url(#glow)" />

  <!-- Background Matrix / Multiplexer Pane Grid Lines -->
  <g opacity="0.15">
    <path class="animated-grid" d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="1" />
    <path class="animated-grid" d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Outer Neon Frame Border with subtle animation -->
  <rect class="glow-border" x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="url(#neon-cyan)" stroke-width="2" opacity="0.5" />

  <!-- Terminal Window Mockup Frame in Foreground -->
  <g transform="translate(60, 42)">
    <!-- Window Header -->
    <rect x="0" y="0" width="1080" height="40" rx="10" fill="#1e293b" />
    <circle cx="24" cy="20" r="6" fill="#ef4444" />
    <circle cx="44" cy="20" r="6" fill="#f59e0b" />
    <circle cx="64" cy="20" r="6" fill="#10b981" />
    
    <!-- Window Tabs / Session Badges -->
    <rect x="90" y="8" width="140" height="24" rx="5" fill="#0f172a" />
    <text x="105" y="24" fill="#38bdf8" font-family="monospace" font-size="11">● 0:tmux[claude]</text>
    
    <rect x="238" y="8" width="130" height="24" rx="5" fill="#334155" opacity="0.7" />
    <text x="252" y="24" fill="#94a3b8" font-family="monospace" font-size="11">1:zellij[dev]</text>

    <rect x="376" y="8" width="120" height="24" rx="5" fill="#334155" opacity="0.7" />
    <text x="390" y="24" fill="#94a3b8" font-family="monospace" font-size="11">2:cmux[agent]</text>

    <text x="1040" y="25" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">GPU ACCELERATED ⚡</text>

    <!-- Window Body Panel -->
    <rect x="0" y="38" width="1080" height="236" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />

    <!-- Terminal Prompt Line -->
    <g transform="translate(40, 78)">
      <text class="code-term" x="0" y="0">❯ agy-agent --multiplexer=tmux --layout=quad-split --watch</text>
      <rect class="cursor-blink" x="480" y="-12" width="8" height="15" fill="#38bdf8" />
    </g>

    <!-- Main Title in Prominent Foreground (high contrast, zero occlusion) -->
    <g transform="translate(40, 134)">
      <text class="title-text">
        Awesome Terminal Multiplexing <tspan fill="url(#neon-cyan)">&amp; AI Workspaces</tspan>
      </text>
    </g>

    <!-- Subtitle in Prominent Foreground -->
    <g transform="translate(42, 172)">
      <text class="subtitle-text">
        Curated ecosystem of next-generation split panes, persistent sessions &amp; autonomous agent hubs 🚀
      </text>
    </g>

    <!-- Floating Feature Pills / Category Badges at bottom of card -->
    <g transform="translate(42, 210)">
      <!-- Pill 1 -->
      <g class="pill-float-1">
        <rect x="0" y="0" width="170" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text class="badge-label" x="16" y="22" fill="#38bdf8">⚡ tmux &amp; Zellij</text>
      </g>

      <!-- Pill 2 -->
      <g class="pill-float-2" transform="translate(186, 0)">
        <rect x="0" y="0" width="220" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
        <text class="badge-label" x="18" y="22" fill="#c084fc">🤖 Multi-Agent Sandboxes</text>
      </g>

      <!-- Pill 3 -->
      <g class="pill-float-3" transform="translate(422, 0)">
        <rect x="0" y="0" width="190" height="34" rx="17" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
        <text class="badge-label" x="18" y="22" fill="#34d399">🖥️ Persistent PTYs</text>
      </g>

      <!-- Pill 4 -->
      <g class="pill-float-1" transform="translate(628, 0)">
        <rect x="0" y="0" width="196" height="34" rx="17" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" />
        <text class="badge-label" x="18" y="22" fill="#f43f5e">🔥 GPU Shell Terminals</text>
      </g>

      <!-- Pill 5 -->
      <g class="pill-float-2" transform="translate(840, 0)">
        <rect x="0" y="0" width="156" height="34" rx="17" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.2" />
        <text class="badge-label" x="18" y="22" fill="#e2e8f0">🌐 Web Multiplex</text>
      </g>
    </g>
  </g>
</svg>
